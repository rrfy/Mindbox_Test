# Изолируем приложение в отдельном namespace и даём ему имя для удобства дальнейшей разработки

apiVersion: v1
kind: Namespace
metadata:
  name: web-app
  labels:
    name: web-app


apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: web-app# Namespace для изоляции приложения и единого места привязки всех ресурсов
apiVersion: v1
kind: Namespace
metadata:
  name: web-app
  labels:
    app.kubernetes.io/name: web-app

---
# Высокодоступный Deployment с равномерным распределением по зонам и нодам,
# консервативным rollout без потерь, корректными пробами и экономными ресурсами.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: web-app
  labels:
    app.kubernetes.io/name: web-app
    app: web-app
spec:
  # Базовое число реплик задаём невысоким (2), чтобы не тратить ресурсы зря;
  # фактическое число регулирует HPA (ночью опустит до 1, днём поднимет до 4).
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Без потерь: старые поды убираются только после запуска новых.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        app.kubernetes.io/name: web-app
    spec:
      # Строгое рассеивание по зонам и нодам для отказоустойчивости.
      # DoNotSchedule предотвращает ухудшение skew при дефиците ресурсов.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-app
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-app

      # Дополнительная мягкая анти-аффинити, чтобы по возможности не класть
      # несколько pod'ов на один хост сверх требований spread-constraint.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: web-app
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

      containers:
        - name: web-app
          image: mindbox/the-most-important-web-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          # Ресурсы: CPU всплеск на первые запросы — даём высокий лимит,
          # затем ровное потребление около 0.1 CPU; память ~128Mi с запасом.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "700m"
              memory: "200Mi"

          # Проба запуска: приложение инициализируется 5–10 c.
          # Пока startupProbe не успешна, readiness/liveness не выполняются.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # Период 1с и порог 20 = до 20с на старт с запасом
            periodSeconds: 1
            failureThreshold: 20
            timeoutSeconds: 1

          # Readiness: трафик пойдёт только в готовый pod (исключает под из Service до готовности).
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1

          # Liveness: перезапуск при зависаниях после успешного старта.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          # Безопасные дефолты контейнера (опционально, если образ это поддерживает).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

---
# Автоскейл по CPU, отражающий дневной/ночной цикл: ночью минимум 1, днём поднимется до 4.
# Поведение: плавный scaleDown со стабилизацией и ограничение шага scaleUp для сдерживания всплесков.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app-hpa
  namespace: web-app
  labels:
    app.kubernetes.io/name: web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app-deployment
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Внутрисетевой сервис для интеграции через Ingress/Gateway.
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: web-app
  labels:
    app.kubernetes.io/name: web-app
    app: web-app
spec:
  selector:
    app: web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# PDB в процентах — дружит с HPA и масштабированием, ограничивая добровольные эвикшены.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-app-pdb
  namespace: web-app
  labels:
    app.kubernetes.io/name: web-app
spec:
  # До 25% подов может быть недоступно при добровольных эвикшенах
  # (например, 1 из 4), пропорционально текущему числу реплик.
  maxUnavailable: "25%"
  selector:
    matchLabels:
      app: web-app

  labels:
    app: web-app
spec:
  replicas: 4 # 4 пода справляются с пиковой нагрузкой
  strategy:
    type: RollingUpdate # Плавное обновление для избежания даунтайма
    rollingUpdate:
      maxSurge: 1 # Можно одновременно запустить на 1 под больше желаемого количества
      maxUnavailable: 0 # Во время обновления при пиковой нагрузке нельзя терять ни одного подa 
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      topologySpreadConstraints: # ОТКАЗОУСТОЙЧИВОСТЬ
        - maxSkew: 1 # Максимальная разница в количестве подов между зонами не более 1 для равномерного распределения и высокой отказоустойчивости
          topologyKey: topology.kubernetes.io/zone # Распределять по зонам (domain failure)
          whenUnsatisfiable: ScheduleAnyway # Стараться соблюсти правило, но если нельзя - все равно запускать под
        - maxSkew: 1 # Также распределяем по самим нодам так же для высокой отказоустойчивости
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      containers:
      - name: web-app
        image: mindbox/the-most-important-web-app:latest
        ports:
        - containerPort: 8080 
        resources:
          requests:
            memory: "144Mi" # Память !!!В РАЙОНЕ!!! 128M по нагрузочнуму тестированию. -> Cтавим чуть больше
            cpu: "100m"     # Запрашиваем 0.1 CPU . Этого хватит для стабильной работы
          limits:
            memory: "200Mi" # Даем лимит по памяти чуть больше на случай непредвиденных обстоятельст
            cpu: "700m"     # "на первые запросы приложению требуется значительно больше ресурсов CPU" -> Лимит CPU выставлен выше, чтобы покрыть пиковую нагрузку на первые запросы
        startupProbe: # Т. К. Приложение стартует не стразу надо проверить его на готовность
          httpGet:
            path: /health # Стандартный эндпойнт
            port: 8080
          failureThreshold: 20 # Приложение инициализируется 5-10 сек. Дадим запас в 10 секунд
          periodSeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10 # Даем время на запуск после успешного startupProbe
          periodSeconds: 10
      terminationGracePeriodSeconds: 30 # Время на корректное завершение работы приложения после получения сигнала SIGTERM. Чтоб оно не простаивало и не ело ресурсы в случае отказа


# Надо учесть разницу по нагрузке днём и ночью, для этого будем использовать HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app-hpa
  namespace: web-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app-deployment
  minReplicas: 1 # Минимум 1 под для обработки ночного трафика "ночью запросов на порядки меньше"
  maxReplicas: 4 # Максимум 4 пода, так как известно, что этого хватает на пик
  behavior: # Настройка поведения масштабирования для плавного регулирования количества подов
    scaleDown:
      stabilizationWindowSeconds: 300 # Ждем 5 минут стабильно низкой нагрузки, прежде чем уменьшить количество подов. Защита от резких спадов при обычных или высоких нагрузках
      policies:
      - type: Percent
        value: 50 # Позволяем уменьшать количество подов не более чем на 50% за раз, опять таки же для защиты от резких спадов
        periodSeconds: 60
# В сторону повышения количества подов это правило применять не нужно, т. к. такое резкое повышение нагрузки скорее всего будет спровоцированно DDoS или DoS атакой
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Целевая утилизация CPU 70%. HPA будет добавлять/убирать поды, чтобы выйти на этот показатель. Сделано для оптимизации потребления ресурсов


apiVersion: v1
kind: Service # Для вывода приложения в сеть
metadata:
  name: web-app-service
  namespace: web-app
  labels:
    app: web-app
spec:
  selector:
    app: web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080 # тот же порт, что и раньше
  type: ClusterIP # Сделал тип ClusterIP, так как , трафик будет идет изнутри кластера через Ingress



apiVersion: policy/v1
kind: PodDisruptionBudget # Чтобы приложение не ложелось во время тех. работ
metadata:
  name: web-app-pdb
  namespace: web-app
spec:
  minAvailable: 3 #Гарантируем, что как минимум 3 пода из 4 всегда будут доступны.
  selector:
    matchLabels:
      app: web-app
